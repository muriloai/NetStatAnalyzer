name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore NetStatAnalyzer.sln

      - name: Build solution
        run: dotnet build NetStatAnalyzer.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test NetStatAnalyzer.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Generate Test Summary
        if: always()
        shell: pwsh
        run: |
          $trxPath = Get-ChildItem -Recurse -Filter "test-results.trx" | Select-Object -ExpandProperty FullName -First 1
          if ($trxPath -and (Test-Path $trxPath)) {
            [xml]$trx = Get-Content $trxPath
            $counters = $trx.TestRun.ResultSummary.Counters
            $passed = $counters.passed
            $failed = $counters.failed
            $total = $counters.total
            $skipped = $counters.notExecuted

            $statusText = if ([int]$failed -eq 0) { "Passed" } else { "Failed" }

            @"
          ## Unit Tests Summary

          **Status:** $statusText

          | Metric | Count |
          | :--- | :--- |
          | **Total Tests** | $total |
          | **Passed** | $passed |
          | **Failed** | $failed |
          | **Skipped** | $skipped |

          > Executed automatically on Windows with .NET 8.0 SDK.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
